<h1> Test yourself and what you learned </h1>

<h1> Which one matches with which? </h1>

<div class="matching-container">
  <div class="Image">
  <div class="right-column"> <h2> Here are the images </h2>
    <div class="image-box1" data-match="1"> <button onclick="Image1()"> <img src="Gemstone Image 1.jpg" alt="This is a photo of a piece of Bismuth."> </button> </div>
    <div class="image-box2" data-match="2"> <button onclick="Image2()"> <img src="Gemstone Image 3.jpg" alt="This is an image of benitoite that can be found in California."> </button> </div>
    <div class="image-box3" data-match="3"> <button onclick="Image3()"> <img src="Metal Image 1.jpg" alt="This is an image of raw gold melted and shaped."> </button> </div>
    <div class="image-box4" data-match="4"> <button onclick="Image4()"> <img src="Metal Image 4.jpg" alt="This is an image of processed titanium."> </button> </div>
    </div>
    </div>
  
    <div class="Info">
    <div class="left-column"> <h2> Here are the info </h2>
    <div class="info-box2" data-match="2"> <button onclick="Box2()"> <p>Can be mistaken for sapphire, but it is more valuable.</p> </button> </div>
    <div class="info-box1" data-match="1"> <button onclick="Box1()"> <p>More of a metal than a crystal since it's a brittle, crystalline, white metal with a slight pink tinge.</p> </button> </div>
    <div class="info-box4" data-match="4"> <button onclick="Box4()"> <p>The go-to metal for artificial hip joints, dental implants, and bone pins.</p> </button> </div>
    <div class="info-box3" data-match="3"> <button onclick="Box3()"> <p>There is an average of 0.2 milligrams in the human body.</p> </button> </div>
    </div>
    </div>
    </div>
    </div>
